---
# Copy this directory before use. Replace the example addresses and names; do
# not put passwords, private keys, claim tokens, or other secrets in inventory.
# Do not set ansible_become here; Machstrap escalates only the system tasks
# that require it so user-managed files remain owned by the login account.
all:
  children:
    servers:
      hosts:
        example-server:
          ansible_host: 192.0.2.10
          ansible_user: admin
          # Prefer ~/.ssh/config where practical. Otherwise uncomment:
          # ansible_port: 22
          # ansible_ssh_private_key_file: ~/.ssh/id_ed25519

    workstations:
      hosts:
        example-mac:
          ansible_host: 192.0.2.20
          ansible_user: operator
