---
# Per-host, non-secret settings. Standard Ansible inventory precedence chooses
# the final machstrap_overrides mapping, which is then merged over the profile.
# Standalone variables are available to profile templates and hooks. Keep
# custom values such as paths outside `machstrap_overrides` unless they are a
# documented Machstrap profile setting.
media_root: /srv/media

machstrap_overrides:
  hostname:
    hostname: example-server

# Host-specific secrets can be placed in an encrypted file in this directory,
# using a different filename and the `machstrap_vault_overrides` mapping.
