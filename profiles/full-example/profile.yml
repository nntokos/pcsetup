---
# Complete machstrap profile reference. Machstrap accepts this file as either
# `profile.yml` or `profile.yaml`; this canonical example uses `profile.yml`.
#
# Copy this directory with:
#   ./machstrap profiles new my-machine
#
# Preview it locally:
#   ./machstrap check ~/machine-configs/my-machine --local
#   ./machstrap apply ~/machine-configs/my-machine --local --check --diff
#
# A profile contains desired machine state only. SSH connection data belongs
# in inventory; secrets belong in an encrypted Ansible Vault file. Inventory
# SSH arguments may use Ansible's `inventory_dir` or `inventory_file` path
# tokens; Machstrap resolves those two tokens when building an SSH plan.
# Never set `ansible_become` in an inventory file, `group_vars`, or `host_vars`;
# Machstrap rejects it before invoking Ansible and grants privilege only to
# individual system tasks so user files and repositories stay in the login
# user's home directory. Use the `--ask-sudo-pass` command option when those
# system tasks require a sudo password; passwordless sudo needs no option.
machstrap_profile:
  # Keep this empty in reusable profiles and set a unique name in inventory.
  # On Debian/Ubuntu, Machstrap updates the 127.0.1.1 mapping before changing
  # the hostname so later sudo tasks do not stall on local name resolution.
  # Other Linux systems use `hostname`; macOS can apply all three names.
  hostname: {}
    # computer_name: My Computer
    # local_hostname: my-computer
    # hostname: my-computer

  # Providers are explicit. Irrelevant providers are skipped by platform.
  # `pip` remains available for machines that intentionally need user Python
  # packages; machstrap itself does not use or install any.
  packages:
    apt: []
    snap: []
    brew: []
    cask: []
    pip: []
    # A string installs the stable, non-classic Snap:
    #   - hello-world
    # Use a mapping only when overriding optional Snap controls:
    # `classic: true` is always explicit; Machstrap never grants classic
    # confinement automatically or retries a failed strict install with it.
    #   - name: go
    #     channel: stable
    #     classic: true

  # Values are passed to `git config --global`.
  git_config: {}
    # user.name: Your Name
    # user.email: you@example.com
    # init.defaultBranch: main

  # Clone or update reviewed repositories.
  git_repos: []
    # - repo: https://github.com/example/project.git
    #   path: ~/src/project
    #   branch: main
    #   depth: 1

  # Inline file operations must be a YAML list, even when there is only one.
  # Do not use paths as mapping keys. Validation identifies this profile file
  # and operation line when an item is invalid. Each block ID must remain
  # stable across edits.
  dotfiles: []
    # - path: ~/.zshrc
    #   mode: append       # append, prepend, or replace
    #   block: shell-path
    #   lines:
    #     - export PATH="$HOME/bin:$PATH"

  # Sources are always relative to this profile directory. Absolute paths,
  # traversal, and symlinks are rejected before Ansible connects to a target.
  dotfile_sources: []
    # - source: assets/files/gitconfig
    #   destination: ~/.gitconfig
    #   mode: "0644"

  folder_sources: []
    # - source: assets/files/nvim
    #   destination: ~/.config/nvim
    #   directory_mode: "0755"

  # Optional dotfiles repository. The symlink mode links each top-level entry
  # into $HOME and backs up displaced entries under ~/.machstrap-backup.
  dotfiles_repo: {}
    # repo: https://github.com/you/dotfiles.git
    # path: ~/.dotfiles
    # branch: main
    # method: symlink     # symlink, stow, script, or none
    # stow_packages: [shell, git]
    # script: ./install.sh

  # Generate a client key for GitHub; the private key never leaves the managed
  # host. Before changing the machine, apply probes every configured git_repos
  # and dotfiles_repo URL with target-side credentials and Git prompts disabled.
  # For an explicit github.com SSH URL used for the first time, a real
  # single-host apply displays GitHub's pinned, published Ed25519 fingerprint
  # and requires confirmation before writing it to target known_hosts. It never
  # trusts a key learned from the current network connection. If GitHub then
  # denies repository access, the same run can upload the public key or pause
  # while you register it manually. The upload cannot run on the target, whose
  # key has no access yet: Ansible delegates it to localhost, where `gh
  # ssh-key add` uses the controller's own authenticated GitHub CLI account.
  # Run `gh auth login` on the controller to make that option available; the
  # prompt names the account before anything is uploaded. Existing keypairs are
  # always reused;
  # Machstrap never replaces SSH key material. Access is retried before
  # continuing.
  github_ssh:
    enabled: false
    email: ""
    key_type: ed25519

  # Linux SSH server. Enabling it while passwords are disabled requires at
  # least one real public key, preventing an obvious lockout configuration.
  ssh:
    enabled: false
    authorized_keys: []
      # - ssh-ed25519 AAAA... operator@example
    allow_password: false
    port: 22

  # macOS `defaults write` settings and processes to restart after a change.
  macos:
    defaults: []
      # - domain: NSGlobalDomain
      #   key: AppleShowAllExtensions
      #   value: true
      #   type: bool
    restart: []
      # - Finder
      # - Dock

  # Last-resort commands run as the login user. Prefer a declarative module or
  # a reviewed hook. `creates` and `removes` make commands idempotent.
  commands: []
    # - command: ./configure
    #   chdir: ~/src/project
    #   creates: ~/src/project/.configured
    #   no_log: false

  # Linux/Netplan only. The current subnet must match before any file changes.
  # Changing a live remote interface can still disconnect the controller;
  # always use --check and maintain console access for the first run.
  static_network:
    enabled: false
    address: 192.168.1.100/24
    only_on_subnet: 192.168.1.0/24
    interface: auto
    gateway: auto
    dns: []
    apply: true

  # Linux/UFW only. `configured` controls whether machstrap manages UFW;
  # `enabled` controls the resulting UFW service state.
  firewall:
    configured: false
    enabled: true
    default_incoming: deny
    default_outgoing: allow
    rules: []
      # - port: 22
      #   protocol: tcp
      #   from: 192.168.1.0/24
      #   comment: Administrative SSH

  # Linux WireGuard server. The private key is generated once on the server.
  wireguard:
    enabled: false
    interface: wg0
    address: 10.8.0.1/24
    listen_port: 51820
    private_key_path: /etc/wireguard/server.key
    outbound_interface: auto
    peers: []
      # - name: laptop
      #   public_key: BASE64_PUBLIC_KEY=
      #   allowed_ips: [10.8.0.2/32]
      #   preshared_key: OPTIONAL_BASE64_KEY=

  # Linux/Docker Plex service. Put a claim token in Vault via
  # `machstrap_overrides.plex.claim`, never in this profile.
  plex:
    enabled: false
    image: lscr.io/linuxserver/plex:latest
    config_path: /srv/plex/config
    transcode_path: /srv/plex/transcode
    media_paths: [/srv/media]
    timezone: UTC
    uid: 1000
    gid: 1000
    claim: ""
    update_image: false
