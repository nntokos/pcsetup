---
- name: Resolve the desired Linux hostname
  ansible.builtin.set_fact:
    machstrap_linux_hostname: >-
      {{
        machstrap.hostname.hostname
        | default(machstrap.hostname.local_hostname)
      }}
  when:
    - machstrap_is_linux
    - machstrap.hostname.hostname is defined or machstrap.hostname.local_hostname is defined

- name: Keep the Debian local hostname mapping synchronized
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1(?:\s+|$)'
    line: >-
      127.0.1.1 {{ machstrap_linux_hostname }}{{
        (' ' ~ machstrap_linux_hostname.split('.')[0])
        if '.' in machstrap_linux_hostname else ''
      }}
    insertafter: '^127\.0\.0\.1(?:\s+|$)'
    state: present
  become: true
  when:
    - machstrap_is_linux
    - ansible_facts.os_family == 'Debian'
    - machstrap_linux_hostname is defined

- name: Set Linux hostname
  ansible.builtin.hostname:
    name: "{{ machstrap_linux_hostname }}"
  become: true
  when:
    - machstrap_is_linux
    - machstrap_linux_hostname is defined

- name: Verify the Debian hostname resolves locally
  ansible.builtin.command:
    argv: [getent, hosts, "{{ machstrap_linux_hostname }}"]
  changed_when: false
  become: true
  when:
    - machstrap_is_linux
    - ansible_facts.os_family == 'Debian'
    - machstrap_linux_hostname is defined
    - not ansible_check_mode

- name: Read current macOS machine names
  ansible.builtin.command:
    argv: [scutil, --get, "{{ item.scutil }}"]
  loop:
    - {key: computer_name, scutil: ComputerName}
    - {key: local_hostname, scutil: LocalHostName}
    - {key: hostname, scutil: HostName}
  register: machstrap_macos_names
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - machstrap_is_macos
    - machstrap.hostname[item.key] is defined

- name: Set macOS machine names
  ansible.builtin.command:
    argv:
      - scutil
      - --set
      - "{{ item.item.scutil }}"
      - "{{ machstrap.hostname[item.item.key] }}"
  loop: "{{ machstrap_macos_names.results | default([]) }}"
  become: true
  when:
    - not item.skipped | default(false)
    - item.stdout != machstrap.hostname[item.item.key]
    - not ansible_check_mode
