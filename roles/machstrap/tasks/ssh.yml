---
- name: Install the OpenSSH server
  ansible.builtin.apt:
    name: openssh-server
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when:
    - machstrap_is_linux
    - machstrap.ssh.enabled | default(false)

- name: Ensure the user SSH directory exists
  ansible.builtin.file:
    path: "{{ machstrap_home }}/.ssh"
    state: directory
    mode: "0700"
  when: machstrap.ssh.enabled | default(false)

- name: Install authorized SSH keys
  ansible.builtin.lineinfile:
    path: "{{ machstrap_home }}/.ssh/authorized_keys"
    line: "{{ item }}"
    create: true
    mode: "0600"
  loop: "{{ machstrap.ssh.authorized_keys | default([]) }}"
  when:
    - machstrap_is_linux
    - machstrap.ssh.enabled | default(false)

- name: Configure sshd safely through a drop-in
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/90-machstrap.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by machstrap
      PasswordAuthentication {{ 'yes' if machstrap.ssh.allow_password | default(false) else 'no' }}
      Port {{ machstrap.ssh.port | default(22) }}
  become: true
  notify: Restart SSH
  when:
    - machstrap_is_linux
    - machstrap.ssh.enabled | default(false)

- name: Enable the SSH service
  ansible.builtin.service:
    name: ssh
    enabled: true
    state: started
  become: true
  when:
    - machstrap_is_linux
    - machstrap.ssh.enabled | default(false)
