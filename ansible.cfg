[defaults]
# Keep the runtime conventional and quiet enough to review. Security-sensitive
# SSH behavior is intentionally left to OpenSSH; host-key checking remains on.
roles_path = ./roles
inventory = ./inventories/example/hosts.yml
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
nocows = True
stdout_callback = default
display_skipped_hosts = False

[privilege_escalation]
# Tasks opt into become individually. Never run the whole play as root.
become = False

[ssh_connection]
pipelining = True
