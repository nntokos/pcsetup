---
machstrap_profile:
  hostname:
    computer_name: Machstrap E2E Mac
    local_hostname: machstrap-e2e-mac
    hostname: machstrap-e2e-mac
  packages:
    apt: []
    snap: []
    brew: [jq, tree]
    cask: [font-fira-code]
    pip: [cowsay]
  git_config:
    user.name: Machstrap macOS E2E
    user.email: macos-e2e@example.invalid
    init.defaultBranch: main
  git_repos:
    - repo: file:///Users/Shared/machstrap-fixture.git
      path: ~/src/fixture
      branch: main
      depth: 1
  dotfiles:
    - path: ~/.machstrap-replace
      mode: replace
      block: replace
      lines: [replace-line]
    - path: ~/.machstrap-blocks
      mode: prepend
      block: prepend
      lines: [prepend-line]
    - path: ~/.machstrap-blocks
      mode: append
      block: append
      lines: [append-line]
  dotfile_sources:
    - source: assets/copied.conf
      destination: ~/.config/machstrap/copied.conf
      mode: "0600"
  folder_sources:
    - source: assets/folder
      destination: ~/.config/machstrap-folder
      directory_mode: "0700"
  dotfiles_repo:
    repo: file:///Users/Shared/machstrap-fixture.git
    path: ~/.dotfiles
    branch: main
    method: symlink
  github_ssh:
    enabled: true
    email: macos-e2e@example.invalid
    key_type: ed25519
  ssh: {enabled: false, authorized_keys: [], allow_password: false, port: 22}
  macos:
    defaults:
      - domain: NSGlobalDomain
        key: AppleShowAllExtensions
        value: true
        type: bool
    restart: [SystemUIServer]
  commands:
    - command: "printf 'command\\n' > .machstrap-command"
      chdir: "~"
      creates: ~/.machstrap-command
      no_log: false
  static_network: {enabled: false}
  firewall: {configured: false}
  wireguard: {enabled: false}
  plex: {enabled: false}
