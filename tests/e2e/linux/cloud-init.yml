#cloud-config
hostname: __HOSTNAME__
manage_etc_hosts: true
users:
  - default
  - name: cc
    gecos: Machstrap Test User
    groups: [sudo]
    shell: /bin/bash
    lock_passwd: false
    plain_text_passwd: machstrap-test-password
    ssh_authorized_keys:
      - __PUBLIC_KEY__
ssh_pwauth: false
package_update: true
packages:
  - git
  - openssh-server
  - python3
  - python3-pip
  - qemu-guest-agent
  - sudo
write_files:
  - path: /etc/sudoers.d/90-machstrap-e2e
    owner: root:root
    permissions: "0440"
    content: |
      Defaults logfile="/var/log/machstrap-sudo.log"
      Defaults loglinelen=0
      __SUDO_RULE__
  - path: /etc/pip.conf
    owner: root:root
    permissions: "0644"
    content: |
      [global]
      break-system-packages = true
runcmd:
  - [systemctl, enable, --now, qemu-guest-agent]
  - [systemctl, enable, --now, ssh]
  - [cloud-init-per, once, fixture-git, bash, -lc, "git init --bare /srv/fixture.git && git init /tmp/fixture-work && git -C /tmp/fixture-work config user.name 'Machstrap Test' && git -C /tmp/fixture-work config user.email test@example.invalid && printf 'fixture\n' >/tmp/fixture-work/README.md && git -C /tmp/fixture-work add README.md && git -C /tmp/fixture-work commit -m fixture && git -C /tmp/fixture-work branch -M main && git -C /tmp/fixture-work remote add origin /srv/fixture.git && git -C /tmp/fixture-work push origin main && rm -rf /tmp/fixture-work && chown -R cc:cc /srv/fixture.git && chmod -R u+rwX,go+rX /srv/fixture.git"]
final_message: machstrap e2e guest ready
