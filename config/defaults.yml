---
# Internal normalized defaults. Profiles override these under
# `machstrap_profile`; inventory may then override them under
# `machstrap_overrides`.
machstrap_defaults:
  hostname: {}
  packages:
    apt: []
    snap: []
    brew: []
    cask: []
    pip: []
  git_config: {}
  git_repos: []
  dotfiles: []
  dotfile_sources: []
  folder_sources: []
  dotfiles_repo: {}
  github_ssh:
    enabled: false
    email: ""
    key_type: ed25519
  ssh:
    enabled: false
    authorized_keys: []
    allow_password: false
    port: 22
  macos:
    defaults: []
    restart: []
  commands: []
  static_network:
    enabled: false
  firewall:
    configured: false
  wireguard:
    enabled: false
  plex:
    enabled: false
