name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ansible-core expect
      - name: Install macOS test dependencies
        if: runner.os == 'macOS'
        run: brew list --versions ansible >/dev/null || brew install ansible
      - name: Run fast, non-mutating tests
        run: ./tests/run-tests.sh
