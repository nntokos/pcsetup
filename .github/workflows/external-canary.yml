name: external-canary

on:
  schedule:
    - cron: "41 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    if: vars.MACHSTRAP_CANARY_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, machstrap-vm]
    timeout-minutes: 120
    concurrency:
      group: machstrap-linux-vm
      cancel-in-progress: false
    environment: e2e-canary
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare pinned Ubuntu image
        run: ./tests/e2e/prepare-images.sh
      - name: Test real GitHub, Snap Store, and Plex registry
        env:
          GH_TOKEN: ${{ secrets.MACHSTRAP_E2E_GH_TOKEN }}
          MACHSTRAP_E2E_GH_REPO: ${{ vars.MACHSTRAP_E2E_GH_REPO }}
          MACHSTRAP_E2E_ARTIFACT_DIR: ${{ github.workspace }}/test-artifacts/external-canary
        run: ./tests/e2e/run-linux.sh --os 24.04 --sudo passwordless --scenario external-services
      - name: Upload sanitized canary diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: external-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-artifacts/external-canary
            tests/logs
          if-no-files-found: ignore
          retention-days: 14
